# Builds CiteTool for Windows in GitHub's cloud. Trigger it from the
# Actions tab ("Run workflow") or just by uploading/changing any file.
name: Build Windows app

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: |
          python dev/make_test_doc.py
          python dev/test_end_to_end.py
      - name: Build app
        run: pyinstaller CiteTool.spec --noconfirm
      - name: Package
        run: Compress-Archive -Path dist/CiteTool -DestinationPath CiteTool-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CiteTool-windows
          path: CiteTool-windows.zip
          retention-days: 30
